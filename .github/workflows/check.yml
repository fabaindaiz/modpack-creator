name: check

on:
  # Every branch, not only main: work in a branch (plan-de-trabajo.md §2) is checked before it merges.
  push:
  pull_request:

jobs:
  gate:
    # El gate de este repositorio (d-7985ee-fd2a8d): bundle, audit, mypy y tests, en Python 3.12,
    # la versión de la imagen (d-7985ee-7bc399). Los tests de base corren contra un MongoDB real
    # (i-7985ee-ade111); nada aquí toca Modrinth ni Pterodactyl.
    runs-on: ubuntu-latest
    services:
      mongo:
        # Fija, como MONGO_VERSION en docker/.env. CI no sigue a producción: producción
        # se sube a 8.0 y CI se queda en 8.0 (d-7985ee-83eb5b, docs/runbooks/migrar-mongo-a-volumen.md).
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Con CI definido, el fixture `mongo` falla en vez de saltarse si esto falta (tests/conftest.py).
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hatch
        run: pipx install hatch==1.18.1
      - name: Gate
        run: hatch run gate

  image:
    # The deployable artefact (i-7985ee-a77cdc): the image builds and the app imports inside it with
    # placeholder configuration, and the compose file is valid with its required variables set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t modpack-creator-api:ci -f docker/Dockerfile .
      - name: The app imports inside the image
        run: >
          docker run --rm
          -e SESSION_SECRET=ci -e MONGODB_URI=mongodb://127.0.0.1:1 -e PTERODACTYL_API_URL=http://127.0.0.1:1/api/
          -e OIDC_CLIENT_ID=ci -e OIDC_CLIENT_SECRET=ci -e OIDC_METADATA_URL=http://127.0.0.1:1/
          -e OIDC_ALLOWED_GROUPS=ci -e OIDC_OPERATOR_GROUPS=ci
          modpack-creator-api:ci python -c "import main; print(main.app.title)"
      - name: The panel assets are in the image
        run: >
          docker run --rm --entrypoint sh modpack-creator-api:ci
          -c 'test -s /app/src/web/static/dist/app.css && test -s /app/src/web/static/dist/htmx.min.js'
      - name: The compose file is valid
        env:
          MONGO_VERSION: "8.0"
          FORWARDED_ALLOW_IPS: 127.0.0.1
          API_BIND_IP: 127.0.0.1
          MONGODB_PASSWORD: ci
          MONGOWEB_PASSWORD: ci
        run: |
          touch .env.yaml
          docker compose -f docker/docker-compose.yaml config --quiet
          # mongo-express only on demand: not among the services `up` starts.
          ! docker compose -f docker/docker-compose.yaml config --services | grep -qx mongoweb
          docker compose -f docker/docker-compose.yaml --profile admin config --services | grep -qx mongoweb
      - name: The compose file refuses to run without MONGO_VERSION
        env:
          FORWARDED_ALLOW_IPS: 127.0.0.1
          API_BIND_IP: 127.0.0.1
          MONGODB_PASSWORD: ci
          MONGOWEB_PASSWORD: ci
        run: |
          touch .env.yaml
          ! docker compose -f docker/docker-compose.yaml config --quiet
      - name: The compose file refuses to publish the API without API_BIND_IP
        env:
          MONGO_VERSION: "8.0"
          FORWARDED_ALLOW_IPS: 127.0.0.1
          MONGODB_PASSWORD: ci
          MONGOWEB_PASSWORD: ci
        run: |
          touch .env.yaml
          ! docker compose -f docker/docker-compose.yaml config --quiet
