# Variables que este archivo exige (en docker/.env o exportadas en la shell; ver
# docs/runbooks/migrar-mongo-a-volumen.md):
#   MONGO_VERSION      versión fija de la imagen de Mongo, igual o mayor que la que escribió los
#                      datos y a lo sumo una versión mayor arriba (d-7985ee-398653)
#   MONGODB_PASSWORD   contraseña del usuario root de Mongo
#   MONGOWEB_PASSWORD  contraseña de mongo-express
#   FORWARDED_ALLOW_IPS  la IP o red del proxy inverso: uvicorn solo confía en X-Forwarded-Proto
#                      de ella, y el chequeo de origen del panel lo necesita (d-7985ee-491c83;
#                      docs/runbooks/desplegar-panel.md)
#   API_BIND_IP        la IP de LAN de este servidor por la que llega el proxy, que corre en otra
#                      máquina: la API se publica solo ahí, nunca en todas las interfaces
# Plantilla sin secretos: docker/.env.example. Nunca correr `down -v`: borra el volumen con los datos.

# Los logs de cada contenedor rotan: sin tope, json-file crece hasta llenar el disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    container_name: modpack-api
    image: modpack-creator-api:latest
    restart: "always"
    logging: *logging
    # Solo en la IP de LAN por la que llega el proxy (otra máquina). Sin default: publicar en
    # 0.0.0.0 dejaría entrar por HTTP, sin el proxy, desde cualquier red que alcance el host.
    ports:
      - "${API_BIND_IP:?API_BIND_IP sin definir: la IP de LAN de este servidor por la que llega el proxy}:8000:8000"
    environment:
      # La IP o red del proxy inverso, para que uvicorn confíe en X-Forwarded-Proto: el redirect
      # del login sale en https y el chequeo de origen del panel compara con el esquema real. Sin
      # default: uno equivocado rechazaría al propio panel sin avisar.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:?FORWARDED_ALLOW_IPS sin definir: la IP o red del proxy inverso}"
    volumes:
      # La configuración y los secretos, de solo lectura (d-7985ee-358aa6). create_host_path en
      # false: si falta .env.yaml, falla en vez de crear un directorio con ese nombre.
      - type: bind
        source: ../.env.yaml
        target: /app/.env.yaml
        read_only: true
        bind:
          create_host_path: false
    # /health/ready answers 503 while MongoDB does not answer a ping (i-7985ee-90f944). The image
    # has no curl: Python's urllib raises on a non-2xx answer, and the check fails.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    container_name: modpack-mongodb
    image: "mongo:${MONGO_VERSION:?MONGO_VERSION sin definir: ver docs/runbooks/migrar-mongo-a-volumen.md}"
    restart: "always"
    logging: *logging
    # Solo desde el propio host: la API llega por la red de Compose (mongodb:27017).
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "mongoadmin"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD:?MONGODB_PASSWORD sin definir}"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Solo a pedido (perfil admin): `run.sh` no lo levanta. Para mirar la base:
  #   docker compose -f docker/docker-compose.yaml up -d mongoweb    (y `stop.sh` lo apaga)
  # Versión fija: mongo-express no publica una nueva desde 1.0.2 (2024).
  mongoweb:
    container_name: modpack-mongoweb
    image: mongo-express:1.0.2-20-alpine3.19
    profiles: ["admin"]
    restart: always
    logging: *logging
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: "mongoweb"
      ME_CONFIG_BASICAUTH_PASSWORD: "${MONGOWEB_PASSWORD:?MONGOWEB_PASSWORD sin definir}"
      ME_CONFIG_MONGODB_URL: "mongodb://mongoadmin:${MONGODB_PASSWORD}@mongodb:27017/"
    depends_on:
      mongodb:
        condition: service_healthy

# Volúmenes con nombre (d-7985ee-398653): sobreviven a `down` y a recrear los contenedores.
volumes:
  mongodb-data:
  mongodb-config:
