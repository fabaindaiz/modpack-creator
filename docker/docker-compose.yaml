services:
  api:
    container_name: modpack-creator-api
    image: modpack-creator-api:latest
    restart: "always"
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: "DEV"
    depends_on:
      - mongodb

  mongodb:
    container_name: modpack-creator-mongodb
    image: mongo:latest
    restart: "always"
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "modpack-creator"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD}"
    #volumes:
    #  - "./data:/var/lib/mongodb/data"
  
  mongo-express:
    container_name: modpack-creator-mongo-express
    image: mongo-express:latest
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://modpack-creator:${MONGODB_PASSWORD}@mongodb:27017/"
    depends_on:
      - mongodb